<style>
:root{color-scheme:light;--bg:#eceeed;--surface:#fbfcfb;--ink:#101413;--ink-2:#48504e;--line:#c2cac7;--accent:#1d6b60;--accent-ink:#ffffff;--bad:#b02a2a}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#0e1110;--surface:#171b1a;--ink:#eef1f0;--ink-2:#b7bfbc;--line:#38403d;--accent:#5cb8a5;--accent-ink:#06120f;--bad:#ef7373}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
svg{width:48px;height:48px}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--ink-2)}
label{font-weight:600;font-size:14px}
input[type=password]{width:100%;font:16px system-ui,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.check{display:flex;gap:8px;align-items:center;font-weight:400}
.check input{width:18px;height:18px;accent-color:var(--accent)}
button{min-height:44px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:600 16px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
#msg{color:var(--bad);font-size:14px;min-height:1.5em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

  const STORE = 'b3.lock';
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const form = document.getElementById('lock'), msg = document.getElementById('msg'), go = document.getElementById('go');

  async function unlock(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(DATA.iv) }, key, bytes(DATA.ct));
    const html = new TextDecoder().decode(plain);
    document.open();
    document.write(html);
    document.close();
  }
  async function keyFrom(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' }, base, 256);
  }
  const forget = () => { try { localStorage.removeItem(STORE); } catch {} };

  if (/[?&]lock\b/.test(location.search)) forget();
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch {}
  if (saved) {
    form.hidden = true;
    unlock(bytes(saved)).catch(() => { forget(); form.hidden = false; });
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'הדפדפן הזה לא תומך בנעילה. נסה לפתוח את האתר ב-Chrome או ב-Safari.'; return; }
    go.disabled = true;
    msg.textContent = '';
    try {
      const raw = await keyFrom(document.getElementById('pw').value);
      if (document.getElementById('remember').checked) { try { localStorage.setItem(STORE, toB64(raw)); } catch {} }
      await unlock(raw);
    } catch {
      forget();
      msg.textContent = 'הסיסמה לא נכונה. נסה שוב.';
      go.disabled = false;
